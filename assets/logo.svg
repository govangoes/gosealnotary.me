<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" role="img" aria-label="GoSeal Notary logo">
  <title>GoSeal Notary</title>
  <!-- Seal / stamp icon -->
  <circle cx="28" cy="30" r="22" fill="none" stroke="#1a4f8a" stroke-width="2.5"/>
  <circle cx="28" cy="30" r="16" fill="none" stroke="#1a4f8a" stroke-width="1.2"/>
  <!-- Star burst / seal lines -->
  <g stroke="#1a4f8a" stroke-width="1.5">
    <line x1="28" y1="4"  x2="28" y2="10"/>
    <line x1="28" y1="50" x2="28" y2="56"/>
    <line x1="4"  y1="30" x2="10" y2="30"/>
    <line x1="46" y1="30" x2="52" y2="30"/>
    <line x1="11" y1="11" x2="15.5" y2="15.5"/>
    <line x1="40.5" y1="44.5" x2="45" y2="49"/>
    <line x1="45" y1="11" x2="40.5" y2="15.5"/>
    <line x1="15.5" y1="44.5" x2="11" y2="49"/>
  </g>
  <!-- Checkmark inside seal -->
  <polyline points="19,30 25,37 38,22" fill="none" stroke="#1a4f8a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Wordmark -->
  <text x="62" y="24" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="700" fill="#1a4f8a" letter-spacing="0.5">GoSeal</text>
  <text x="62" y="44" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="400" fill="#4a6fa5" letter-spacing="2">NOTARY</text>
</svg>
